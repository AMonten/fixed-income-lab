[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixed-income-lab"
version = "0.1.0"
description = "A fixed-income analytics toolkit for pricing, cash-flow modelling, risk metrics, and amortizing securities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Montenegro" }]
keywords = [
    "fixed-income",
    "bonds",
    "duration",
    "convexity",
    "yield-to-maturity",
    "amortization",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "pandas>=2.0", "plotly>=5.18"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/AMonten/fixed-income-lab"
Repository = "https://github.com/AMonten/fixed-income-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/fixed_income"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
